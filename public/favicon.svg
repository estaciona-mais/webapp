<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .plus-text {
        font-family: 'Ubuntu', sans-serif;
      }
      .text {
        font-weight: bold;
        fill: #121316;
      }
      .plus{
        fill: #f0a857;
        fill: url(#textGrad)
      }
    </style>
    <linearGradient id="textGrad" gradientTransform="translate(0.5, 0.5) rotate(-45) translate(-0.5, -0.5)">
      <stop offset="0%" stop-color="#70e673" />
      <stop offset="100%" stop-color="#f0a857" />
    </linearGradient>
  </defs>
  <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" font-size="70" class="plus-text">
    <tspan class="text">E</tspan><tspan class="plus">+</tspan>
  </text>
</svg>